name: Release

# Runs only for version tags, and only after a maintainer approves the `release` environment.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-2025
    environment: release
    permissions:
      contents: write      # create the draft release
      id-token: write      # sign the build provenance
      attestations: write  # publish the build provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check tag matches Cargo.toml
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME does not match Cargo.toml version $version" }
          "VERSION=$version" >> $env:GITHUB_ENV

      - run: cargo build --release --locked

      - name: Build installer
        shell: pwsh
        run: |
          ./installer/ensure-inno.ps1
          & $env:ISCC /Qp /DAppVersion=$env:VERSION installer/open-claude.iss

      # Code signing (SignPath Foundation) goes here once the project is accepted:
      # sign target/release/OpenClaude.exe before the installer step, then the installer after it.

      - name: Checksums
        shell: pwsh
        run: |
          Copy-Item target/release/OpenClaude.exe dist/OpenClaude.exe
          Get-ChildItem dist -File | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content dist/SHA256SUMS.txt -Encoding ascii
          Get-Content dist/SHA256SUMS.txt

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/OpenClaude-Setup-*.exe
            dist/OpenClaude.exe

      - name: Draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $sums = Get-Content dist/SHA256SUMS.txt -Raw
          $notes = "It opens Claude.`n`nSHA-256:`n``````n$sums``````n`nVerify the build came from this repository:`n``````n gh attestation verify OpenClaude-Setup-$env:VERSION.exe --repo $env:GITHUB_REPOSITORY`n``````"
          gh release create $env:GITHUB_REF_NAME --draft --title "Open Claude $env:VERSION" --notes $notes (Get-ChildItem dist -File).FullName
