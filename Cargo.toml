[package]
name = "open-claude"
version = "1.0.1"
edition = "2021"
description = "It opens Claude."
license = "MIT"
repository = "https://github.com/scaliastudio/open-claude"
publish = false

[[bin]]
name = "OpenClaude"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_System_Registry",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

# Embeds the icon, product name and version into OpenClaude.exe. Code signing checks
# these attributes, and without them Explorer shows a blank "Details" tab.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.31"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
